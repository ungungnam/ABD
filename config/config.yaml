defaults:
  - env: real
  - task: pick_place
  - policy: vlm_checklist
  - vlm: gpt
  - dataset_recorder: LeRobot
  - train: bc
  - _self_

# Checklist observer always runs regardless of active policy.
# tau_reset here is independent of policy.tau_reset (e.g. ABD uses 0.7).
checklist_observer:
  tau_reset: 0.9
  checklist_dir: ${hydra:runtime.cwd}/config/checklists

perception:
  url: "http://localhost:9877/inference"

motion_planner:
  smoothing: true

max_episodes: 100
max_retries: 3
seed: 0

log_dir: outputs/logs/${now:%Y-%m-%d_%H-%M-%S}
