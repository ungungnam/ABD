name: vlm_checklist
method: VLMChecklist

# Where per-task checklists are read/written. Generated only if the file is
# missing, so human edits to weights and questions survive across runs.
checklist_dir: ${hydra:runtime.cwd}/config/checklists

# Decision thresholds on the weighted-normalized score in [0, 1].
#   score >= tau_reset            -> "next"
#   tau_retry <= score < tau_reset -> "retry"
#   score < tau_retry             -> "reset"
tau_reset: 0.9
max_fail_count: 5
use_cache: false  # true: 프로세스 내 메모리 캐시 사용 (실행 중 파일 수정 미반영)

# Checklist version suffix. "" = v1 (default), "_v2" = v2.
# Files are looked up as {checklist_dir}/{task_name}{version}.json — e.g.
# version="_v2" loads banana_to_pan_v2.json. Override on the CLI:
#   python scripts/main.py policy.version=_v2
version: ""
