# BC Training Configuration
name: bc

# Model
num_cameras: 3
camera_names: [wrist, front, table]
image_size: [128, 128]
image_feature_dim: 128
state_dim: 7
action_dim: 7
hidden_dim: 256
share_encoder: true

# Training
lr: 1e-4
weight_decay: 1e-5
batch_size: 32
num_epochs: 50
val_fraction: 0.2
grad_clip: 1.0
eval_every: 10

# Data
dataset_root: null        # path to collected dataset, or null for dummy
dummy: true               # use dummy data for testing
dummy_episodes: 20
dummy_episode_length: 30
dataset_fraction: 1.0     # fraction of dataset to use (for scaling experiments)

seed: 42
